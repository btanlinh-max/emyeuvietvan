<html lang="vi">
<head>
<meta charset="utf-8">

<title>Em Yêu Viết Văn – Lớp 5</title>
<meta name="description" content="Học và luyện viết 10 dạng bài văn lớp 5: lập dàn ý, viết bài, tự soát lỗi và sửa bài cùng cô trợ lý AI.">
<meta name="theme-color" content="#1d2b53">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>:root{--paper:#fbf6ea;--card:#fffdf6;--ink:#1d2b53;--ink2:#46517a;--mut:#7b7f93;--line:#e7dcc2;--gold:#e8a317;--gold2:#fff1c9;--red:#d64545;--grn:#2f7d5b;--shadow:0 2px 0 rgba(29,43,83,.06),0 8px 24px rgba(29,43,83,.07);--r:14px;--serif:"Lora","Noto Serif",Georgia,serif;--sans:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 .4em}
h1{font-size:clamp(1.6rem,4vw,2.3rem)}h2{font-size:1.4rem}h3{font-size:1.1rem}
p{margin:0 0 .7em}
a{color:var(--ink)}
.muted{color:var(--mut)}.small{font-size:.875rem}.hide,[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:1.15rem;color:#fff;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px;flex:none}
.brand small{display:block;font:500 .68rem var(--sans);opacity:.75;letter-spacing:.03em;margin-top:-2px}
.sp{flex:1}
.who{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 6px 4px 12px;font-size:.88rem}
.who select{background:transparent;border:0;color:#fff;max-width:150px;outline:0;font-weight:600}
.who select option{color:#000}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;color:#fff;opacity:.8;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.9rem}
.nav button:hover,.nav button.on{opacity:1;background:rgba(255,255,255,.14)}
@media(max-width:760px){.nav{position:fixed;bottom:0;left:0;right:0;background:var(--ink);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -4px 16px rgba(0,0,0,.2)}.nav button{flex:1;font-size:.78rem;padding:8px 2px}body{padding-bottom:70px}.brand small{display:none}.who select{max-width:100px}}
/* generic */
main{padding:22px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.92rem;transition:transform .08s}
.btn:hover{background:var(--gold2)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:#fff}.btn.primary:hover{background:#2b3c73}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3b2a00}.btn.gold:hover{background:#f3b53a}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline}
.btn.sm{padding:4px 11px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:.88rem;cursor:pointer;margin:0 6px 6px 0}
.chip:hover{background:var(--gold2);border-color:var(--gold)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:999px;color:#fff}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
label{font-weight:600;font-size:.9rem;display:block;margin:10px 0 4px}
.crumb{font-size:.88rem;margin-bottom:10px}.crumb button{background:none;border:0;cursor:pointer;color:var(--ink2);text-decoration:underline;padding:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;margin-bottom:22px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.hero .art{background:var(--gold2);border:1px solid #f0d78a;border-radius:20px;padding:18px;position:relative;overflow:hidden;min-height:150px}
.hero .art:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 27px,rgba(29,43,83,.1) 27px 28px)}
.hero .art:after{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:var(--red);opacity:.6}
.hero .art p{position:relative;font-family:var(--serif);font-style:italic;font-size:1.05rem;line-height:28px;margin:0 0 0 30px}
.tcard{display:flex;flex-direction:column;gap:6px;cursor:pointer;border-top:6px solid var(--c);text-align:left;width:100%}
.tcard:hover{transform:translateY(-2px);box-shadow:0 2px 0 rgba(0,0,0,.05),0 12px 28px rgba(29,43,83,.12)}
.tcard .ic{font-size:1.9rem;line-height:1}.tcard h3{margin:0}
.gh{display:flex;align-items:center;gap:8px;margin:22px 0 10px}.gh i{width:10px;height:10px;border-radius:50%;background:var(--c)}.gh h2{margin:0;font-size:1.1rem}
/* tabs inside page */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:14px 0;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:9px 14px;font-weight:700;cursor:pointer;color:var(--mut);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
/* stepper */
.steps{display:flex;gap:0;margin:0 0 16px;overflow-x:auto;padding-bottom:4px}
.steps button{flex:1;min-width:92px;background:none;border:0;cursor:pointer;padding:6px 4px;text-align:center;position:relative;color:var(--mut);font-size:.82rem;font-weight:600}
.steps button b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;margin:0 auto 3px;background:#fff;border:2px solid var(--line);font-size:.9rem}
.steps button.on{color:var(--ink)}.steps button.on b{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.steps button.done b{background:var(--grn);border-color:var(--grn);color:#fff}
.sec{border-left:4px solid var(--gold);padding:2px 0 2px 14px;margin:0 0 16px}
.sec .q{margin:6px 0 0;padding-left:18px;color:var(--ink2);font-size:.92rem}
.ex{background:var(--gold2);border-radius:10px;padding:8px 12px;font-family:var(--serif);font-size:.95rem;margin:6px 0 0}
.bad li,.ok li{margin-bottom:4px}
/* editor */
.edwrap{display:grid;grid-template-columns:1fr 310px;gap:16px;align-items:start}
@media(max-width:900px){.edwrap{grid-template-columns:1fr}}
.paper{position:relative;background:#fffef8;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.paper:before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5;z-index:1;pointer-events:none}
.paper textarea{display:block;border:0;border-radius:0;background:repeating-linear-gradient(transparent 0 33px,rgba(29,43,83,.13) 33px 34px);background-attachment:local;font:18px/34px var(--serif);padding:2px 18px 2px 62px;min-height:480px;resize:vertical;width:100%}
.paper textarea:focus{outline:0}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;padding:8px 14px;border-top:1px solid var(--line);background:#fbf7e8}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--grn);width:0}
.side .card{margin-bottom:12px;padding:14px}
.side details summary{cursor:pointer;font-weight:700;padding:2px 0}
.ol{padding:8px 12px;border-left:3px solid var(--gold);background:#fff;border-radius:6px;margin:6px 0;font-size:.9rem;white-space:pre-wrap}
/* feedback */
.fb{border-left:5px solid var(--c,var(--gold));background:#fff;border-radius:10px;padding:10px 14px;margin:8px 0}
.fb.warn{--c:var(--red)}.fb.tip{--c:#2563eb}.fb.ok{--c:var(--grn)}
.fb q{display:block;font-family:var(--serif);color:var(--ink2);margin:2px 0}
.fb.done{opacity:.55}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.score div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;font-size:.85rem}
.score b{display:block;font:700 1.35rem var(--serif)}
.total{font:700 2rem var(--serif)}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover{background:var(--gold2)}
.scroll{overflow-x:auto}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(20,28,60,.5);z-index:60;display:grid;place-items:center;padding:14px}
.modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sample .pt{margin:0 0 12px;padding:10px 14px;background:#fff;border-radius:10px;border:1px solid var(--line)}
.sample .pt h4{margin:0 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.sample .pt p{font-family:var(--serif);font-size:1.02rem;margin:0;white-space:pre-wrap}
.sample .nt{font:italic .85rem var(--sans);color:var(--grn);margin-top:6px}
.spark{width:100%;height:70px}
/* print */
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}
 #printArea{font:14pt/28pt var(--serif);color:#000}
 #printArea h2{font-size:16pt;margin:0 0 4pt}
 #printArea .meta{font:10pt var(--sans);color:#444;margin-bottom:10pt}
 #printArea .txt{white-space:pre-wrap;background:repeating-linear-gradient(transparent 0 27.5pt,#bbb 27.5pt 28pt);padding-left:26pt;border-left:1.5pt solid #d33}}
.brand span{white-space:nowrap}
@media(max-width:760px){.who>span{display:none}.who{padding-left:8px}.brand{font-size:1rem}.top .wrap{gap:8px}}
</style>
</head>

 sample:{title:"Bà nội của em",parts:[
  {t:"Mở bài",x:"Trong gia đình, người em yêu quý nhất là bà nội. Bà đã ngoài bảy mươi tuổi nhưng chiều nào cũng ngồi chờ em ở hiên nhà.",n:"Giới thiệu ngay người được tả và một hình ảnh đáng nhớ."},
  {t:"Thân bài 1",x:"Bà có dáng người nhỏ nhắn, lưng hơi còng vì năm tháng. Mái tóc bạc phơ được bà búi gọn sau gáy bằng chiếc kẹp nâu cũ. Khuôn mặt bà hằn nhiều nếp nhăn, mỗi khi cười, đôi mắt hiền như hai vầng trăng khuyết. Đôi bàn tay bà gầy, chai sần nhưng ấm áp lạ thường.",n:"Chọn vài nét tiêu biểu; có hình ảnh so sánh “hiền như hai vầng trăng khuyết”."},
  {t:"Thân bài 2",x:"Sáng nào bà cũng dậy từ khi gà gáy đầu tiên để nấu nồi cháo nóng cho cả nhà. Bà thoăn thoắt nhặt rau, thái hành, vừa làm vừa khe khẽ ngân nga câu ca cũ. Có hôm em học bài khuya, bà lặng lẽ mang cốc sữa ấm đặt cạnh bàn rồi nhẹ nhàng khép cửa lại, sợ làm em mất tập trung. Bà ít nói nhưng lời nào của bà em cũng nhớ: “Con ơi, đã làm thì phải làm cho tử tế.”",n:"Tả qua hành động, kỉ niệm và lời nói – người đọc hiểu tính cách của bà."},
  {t:"Kết bài",x:"Em mong bà luôn khỏe mạnh để mãi là chỗ dựa của em. Em hứa sẽ học thật chăm để không phụ lòng bà.",n:"Nêu mong muốn và lời hứa, không chỉ viết “em rất yêu bà”."}]}},

{id:"taCanh",g:"ta",name:"Tả cảnh",icon:"🌅",color:"#0f766e",kind:"essay",min:150,max:350,
 short:"Tả một cảnh quen thuộc theo trình tự, bằng nhiều giác quan.",
 goal:"Tả được cảnh vật theo một trình tự hợp lí (thời gian hoặc không gian), dùng giác quan, nhân hóa, so sánh và nêu cảm xúc.",
 secs:[
  {t:"Mở bài",p:"Giới thiệu cảnh em tả, thời điểm và nơi em quan sát.",q:["Em tả cảnh gì, ở đâu, vào lúc nào?","Cảnh ấy gợi cho em cảm giác gì ngay từ đầu?"],s:["Trong những nơi em từng đến, em yêu nhất…","Mỗi khi… cảnh… lại hiện lên…"]},
  {t:"Thân bài 1 – Bao quát",p:"Nhìn toàn cảnh trước: màu sắc, không gian, âm thanh chung.",q:["Nhìn từ xa (hoặc từ cổng vào), em thấy toàn cảnh như thế nào?","Có màu sắc, mùi hương hay âm thanh nào nổi bật?"],s:["Từ xa nhìn lại…","Bao trùm khung cảnh là…"]},
  {t:"Thân bài 2 – Chi tiết",p:"Tả kĩ vài cảnh vật tiêu biểu theo trình tự đã chọn.",q:["Em chọn tả những cảnh vật nào? Theo thứ tự nào (gần đến xa, hay theo thời gian)?","Mỗi cảnh vật có hình dáng, màu sắc, chuyển động gì? Em có thể so sánh hoặc nhân hóa không?"],s:["Gần hơn là…","Những… như đang…","Tiếng… vang lên…"]},
  {t:"Thân bài 3 – Con người trong cảnh",p:"Hoạt động của người, vật làm cảnh sống động.",q:["Ai đang làm gì trong cảnh ấy? Không khí ra sao?"],s:["Trên sân…","Mọi người…"]},
  {t:"Kết bài",p:"Cảm nghĩ về cảnh và việc em sẽ làm.",q:["Cảnh ấy mang lại cho em điều gì?","Em muốn làm gì để giữ gìn cảnh đẹp ấy?"],s:["Em rất yêu…","Em sẽ cùng các bạn giữ gìn…"]}],
 skills:[
  {n:"Chọn trình tự quan sát",d:"Tả theo thời gian (sáng → trưa → chiều) hoặc không gian (xa → gần, bao quát → chi tiết). Đừng nhảy lung tung.",e:"Từ cổng nhìn vào… Gần hơn là… Ở góc sân…"},
  {n:"Dùng nhiều giác quan",d:"Không chỉ nhìn: còn nghe, ngửi, chạm.",e:"Gió thổi nhẹ, lá khẽ xào xạc như thì thầm."},
  {n:"Nhân hóa và so sánh",d:"Cho cảnh vật biết “làm” việc như con người.",e:"Những hàng phượng đứng thẳng như các chú bộ đội gác sân trường."},
  {n:"Gắn cảnh với cảm xúc",d:"Cảm xúc của em làm cảnh có hồn.",e:"Em thấy lòng nhẹ bẫng như bay lên cùng nắng sớm."}],
 bad:["Chỉ liệt kê cảnh vật, không có màu sắc, âm thanh.","Trình tự lộn xộn: đang tả sáng lại nhảy sang chiều.","Dùng từ “đẹp” cho mọi thứ, không nói đẹp như thế nào.","Quên con người và hoạt động trong cảnh."],
 check:["Mở bài nói rõ cảnh nào, lúc nào.","Em có tả theo một trình tự rõ ràng.","Có ít nhất 3 cảnh vật được tả bằng màu sắc, hình dáng hoặc âm thanh.","Có ít nhất 1 hình ảnh nhân hóa hoặc so sánh.","Có hoạt động của người hoặc vật trong cảnh.","Kết bài có cảm nghĩ của em."],
 topics:["Tả cảnh sân trường em vào một buổi sáng.","Tả cảnh làng quê (hoặc khu phố) em vào buổi chiều.","Tả một cơn mưa em đã gặp.","Tả cảnh một công viên (bãi biển, dòng sông) mà em yêu thích.","Tả cảnh sân trường trong giờ ra chơi.","Tả cảnh một ngày hội (chợ Tết, hội làng) em từng đến."],
 vocab:[{g:"Âm thanh",w:["ríu rít","rì rào","xào xạc","lao xao","róc rách","thánh thót","rộn ràng","vi vu"]},
  {g:"Màu sắc, hình ảnh",w:["xanh mướt","vàng óng","lấp lánh","mênh mông","bát ngát","thăm thẳm","sương giăng","đỏ rực"]},
  {g:"Nhân hóa",w:["vươn mình","thì thầm","nô đùa","chào đón","ngủ say","khoác chiếc áo","mỉm cười","nghiêng mình"]}],
 sample:{title:"Sân trường buổi sáng",parts:[
  {t:"Mở bài",x:"Trong tất cả những nơi em từng đến, em yêu nhất là sân trường vào buổi sáng, khi nắng mai vừa chạm khẽ lên mái ngói đỏ.",n:"Nêu rõ cảnh, thời điểm và tình cảm."},
  {t:"Thân bài 1",x:"Từ cổng nhìn vào, sân trường rộng như một tấm thảm phẳng lặng, được quét sạch từng chiếc lá. Những hàng phượng đứng thẳng hai bên, tán lá xanh mướt lấp lánh sương đêm. Gió thổi nhẹ, lá khẽ xào xạc như thì thầm chào các bạn.",n:"Tả bao quát trước; có so sánh và nhân hóa; có cả hình ảnh và âm thanh."},
  {t:"Thân bài 2",x:"Tiếng trống trường vừa dứt cũng là lúc sân trường nhộn nhịp hẳn lên. Các bạn nhỏ ríu rít chạy vào lớp, chiếc cặp sau lưng nảy tưng tưng. Ở góc sân, mấy bạn lớp em đang chuyền cầu, tiếng cười giòn tan vang cả một khoảng trời. Bác bảo vệ đứng cạnh cổng, mỉm cười gật đầu với từng em.",n:"Từ cảnh vật chuyển sang con người – theo trình tự không gian."},
  {t:"Kết bài",x:"Sân trường không chỉ là nơi em vui chơi mà còn lưu giữ biết bao kỉ niệm tuổi thơ. Em tự nhủ sẽ cùng các bạn giữ gìn sân trường luôn sạch đẹp.",n:"Kết bằng cảm nghĩ và việc làm cụ thể."}]}},

{id:"keChuyen",g:"ke",name:"Kể chuyện sáng tạo",icon:"📖",color:"#c2410c",kind:"essay",min:150,max:400,
 short:"Viết lại câu chuyện đã học: đổi ngôi kể, thêm lời thoại, đổi kết thúc.",
 goal:"Kể lại một câu chuyện đã nghe/đọc theo cách sáng tạo: đổi ngôi kể, thêm chi tiết (lời thoại, suy nghĩ), thay đổi hoặc nối thêm kết thúc nhưng hợp lí.",
 secs:[
  {t:"Mở đầu",p:"Giới thiệu nhân vật, bối cảnh và chọn ngôi kể.",q:["Em kể chuyện nào? Em kể theo lời ai (ngôi “tôi” của nhân vật nào) hay lời người kể chuyện?","Câu chuyện xảy ra ở đâu, khi nào?"],s:["Tôi là… Hôm ấy…","Ngày xưa, ở… có…"]},
  {t:"Diễn biến",p:"Kể các sự việc chính theo thứ tự, thêm lời thoại, hành động, suy nghĩ.",q:["Những sự việc chính nào xảy ra theo thứ tự?","Nhân vật nói gì, nghĩ gì, cảm thấy ra sao ở mỗi sự việc?","Em thêm chi tiết riêng nào cho câu chuyện?"],s:["Bỗng nhiên…","“…” – … nói.","Trong lòng … thầm nghĩ…"]},
  {t:"Cao trào, kết thúc",p:"Sự việc quan trọng nhất và kết thúc (giữ nguyên hoặc em sáng tạo).",q:["Điều gì xảy ra ở đỉnh điểm của chuyện?","Kết thúc em chọn là gì? Vì sao nó hợp lí?"],s:["Đúng lúc ấy…","Cuối cùng…","Từ đó…"]},
  {t:"Bài học",p:"Điều em rút ra (nếu cần).",q:["Câu chuyện giúp em hiểu điều gì?"],s:["Qua câu chuyện, em hiểu rằng…"]}],
 skills:[
  {n:"Chọn ngôi kể",d:"Nhập vai nhân vật (ngôi “tôi”) giúp câu chuyện có góc nhìn mới.",e:"Tôi là con chim lạ vẫn ghé thăm cây khế đầu ngõ…"},
  {n:"Thêm lời thoại",d:"Lời nói của nhân vật làm truyện sống động. Dùng dấu ngoặc kép hoặc gạch đầu dòng.",e:"“Anh đừng khóc,” tôi nói."},
  {n:"Thêm suy nghĩ, cảm xúc",d:"Cho người đọc biết nhân vật nghĩ gì, run hay vui.",e:"Anh ngỡ ngàng nhìn tôi rồi khẽ gật đầu."},
  {n:"Đổi kết thúc hợp lí",d:"Kết thúc mới phải phù hợp tính cách nhân vật và bài học của chuyện.",e:"Từ đó, cây khế trĩu quả, nụ cười anh sáng cả ngõ."}],
 bad:["Chép lại truyện gốc, không có gì mới.","Đổi ngôi kể giữa chừng (đang “tôi” lại thành “cậu ấy”).","Thiếu lời thoại hoặc suy nghĩ nhân vật.","Kết thúc mới không hợp tính cách nhân vật."],
 check:["Em chọn một ngôi kể và giữ nguyên đến hết bài.","Có giới thiệu nhân vật và bối cảnh.","Các sự việc theo thứ tự rõ ràng.","Có ít nhất 2 lời thoại của nhân vật.","Có suy nghĩ hoặc cảm xúc của nhân vật.","Kết thúc hợp lí và có ý nghĩa."],
 topics:["Kể lại truyện “Cây khế” theo lời của con chim thần.","Kể lại truyện “Thạch Sanh” và thay đổi một chi tiết quan trọng.","Kể lại “Sơn Tinh, Thủy Tinh” theo lời của Mị Nương.","Kể lại “Tấm Cám” theo lời của chiếc giày.","Nối tiếp một câu chuyện em đã học: chuyện xảy ra sau đó như thế nào?","Tưởng tượng: một ngày em là chú mèo (chiếc bút, đám mây) của lớp em."],
 vocab:[{g:"Từ dẫn chuyện",w:["bỗng nhiên","đúng lúc ấy","không ngờ","thế rồi","ít lâu sau","từ đó về sau","chợt","cuối cùng"]},
  {g:"Cảm xúc nhân vật",w:["hồi hộp","phân vân","ngỡ ngàng","hối hận","hân hoan","lo lắng","xúc động","bồn chồn"]},
  {g:"Lời dẫn thoại",w:["thì thầm","nài nỉ","reo lên","nghẹn ngào","ngập ngừng","khẽ gật đầu","giải thích","quả quyết"]}],
 sample:{title:"Cây khế – kể theo lời con chim (đoạn mẫu)",parts:[
  {t:"Mở đầu",x:"Tôi là con chim lạ vẫn thường ghé thăm cây khế đầu ngõ nhà người em. Hôm ấy, vừa đáp xuống cành, tôi bỗng nghe thấy tiếng khóc thút thít bên gốc cây.",n:"Đổi ngôi kể: nhập vai con chim (ngôi “tôi”)."},
  {t:"Diễn biến",x:"Người nông dân hiền lành ngước lên, nước mắt còn ướt má. Tôi ngập ngừng một lúc rồi cất tiếng: “Anh đừng khóc. Tôi ăn vài quả khế, anh may cho tôi chiếc túi ba gang, tôi sẽ đưa anh đến nơi có vàng bạc.” Anh ngỡ ngàng nhìn tôi rồi khẽ gật đầu. Tối ấy, tôi cõng anh bay qua biển cả mênh mông. Gió lạnh buốt, nhưng anh chỉ lo nhìn xuống hòn đảo hiện dần dưới ánh trăng. Đến nơi, tôi dặn: “Chỉ lấy vừa đủ thôi nhé.” Anh làm đúng lời, chỉ nhặt vài viên rồi bỏ vào túi.",n:"Có lời thoại, suy nghĩ, chi tiết thêm mới (lời dặn “vừa đủ”)."},
  {t:"Kết thúc",x:"Nhìn anh vui mừng, tôi hiểu: người sống biết đủ thì dù ít cũng thành nhiều. Từ đó, mỗi lần bay qua, tôi lại thấy cây khế trĩu quả, và nụ cười của anh sáng cả ngõ.",n:"Bài học rút ra từ góc nhìn của chính nhân vật kể chuyện."}]}},

{id:"camXuc",g:"doan",name:"Đoạn văn nêu cảm xúc",icon:"💛",color:"#be185d",kind:"para",min:60,max:180,
 short:"Viết một đoạn văn thể hiện tình cảm, cảm xúc về một người, sự việc hay cảnh vật.",
 goal:"Viết đoạn văn 6–10 câu nói rõ cảm xúc, giải thích vì sao em có cảm xúc ấy và biểu hiện bằng hành động, hình ảnh.",
 secs:[
  {t:"Câu mở đoạn",p:"Nêu đối tượng và cảm xúc chủ đạo.",q:["Em viết về điều gì (người, sự việc, cảnh)?","Em cảm thấy thế nào? (vui, xúc động, tự hào, nhớ…)"],s:["Em nhớ mãi…","Em vô cùng xúc động khi…"]},
  {t:"Các câu triển khai",p:"Chi tiết, kỉ niệm làm em có cảm xúc ấy; biểu hiện của em.",q:["Chuyện gì đã xảy ra? Em thấy gì, nghe gì?","Cơ thể em phản ứng thế nào (tim, tay, má, mắt…)?"],s:["Khi… tim em…","Em cảm thấy như…"]},
  {t:"Câu kết đoạn",p:"Khẳng định lại cảm xúc hoặc mong ước, lời hứa.",q:["Điều ấy để lại trong em điều gì? Em mong hoặc hứa điều gì?"],s:["Em tự hứa…","Kỉ niệm ấy sẽ theo em…"]}],
 skills:[
  {n:"Nói rõ cảm xúc",d:"Dùng từ chỉ cảm xúc cụ thể thay cho “vui”, “buồn” chung chung.",e:"hồi hộp, nao nao, tự hào, rưng rưng"},
  {n:"Cảm xúc qua biểu hiện",d:"Tả phản ứng của cơ thể và hành động để người đọc cảm được.",e:"Tim em đập thình thịch, hai tay run run nắm chặt vạt áo."},
  {n:"Giải thích vì sao",d:"Có lí do thì cảm xúc mới thuyết phục.",e:"Những đêm cặm cụi sửa bài bỗng trở nên thật đáng giá."},
  {n:"So sánh hình ảnh",d:"Dùng hình ảnh để cảm xúc thêm rõ.",e:"Trong lòng em nở một đóa hoa nhỏ."}],
 bad:["Chỉ viết “em rất vui, em rất buồn” lặp lại.","Kể sự việc dài mà không nói cảm xúc.","Viết nhiều đoạn nhỏ rời rạc, không thành một đoạn.","Câu kết chỉ chép lại câu mở."],
 check:["Câu đầu nêu rõ chuyện gì, cảm xúc gì.","Có ít nhất 1 chi tiết cụ thể (ai, ở đâu, lúc nào).","Có biểu hiện cảm xúc (cơ thể, hành động).","Có lí do vì sao em có cảm xúc ấy.","Có hình ảnh so sánh hoặc từ ngữ giàu cảm xúc.","Câu kết nêu mong ước hoặc lời hứa."],
 topics:["Cảm xúc của em khi được cô giáo khen trước lớp.","Cảm xúc của em khi chia tay một người bạn.","Cảm xúc của em khi đứng trước cánh đồng lúa chín quê em.","Cảm xúc của em khi giúp đỡ một người gặp khó khăn.","Cảm xúc của em khi nhận được món quà bất ngờ.","Tình cảm của em với mái trường tiểu học sắp chia tay."],
 vocab:[{g:"Từ chỉ cảm xúc",w:["hồi hộp","xúc động","tự hào","nao nao","bồi hồi","rưng rưng","bâng khuâng","háo hức"]},
  {g:"Biểu hiện",w:["tim đập thình thịch","má nóng bừng","mắt cay cay","run run","nghẹn lại","mỉm cười","rạng rỡ","lòng ấm áp"]}],
 sample:{title:"Lời khen của cô",parts:[
  {t:"Đoạn văn",x:"Em nhớ mãi buổi sáng cô giáo khen bài văn của em trước cả lớp. Khi cô cất tiếng gọi tên, tim em đập thình thịch như tiếng trống trường ngày khai giảng. Em đứng lên, hai tay run run nắm chặt vạt áo, má nóng bừng. Giọng cô ấm áp: “Bài văn của em có những hình ảnh rất đẹp.” Nghe xong, em thấy trong lòng nở một đóa hoa nhỏ, niềm vui lan khắp người. Những đêm cặm cụi sửa bài bỗng trở nên thật đáng giá. Em tự hứa sẽ chăm chỉ hơn để xứng đáng với lời khen ấy.",n:"Câu mở nêu việc và cảm xúc → biểu hiện cơ thể → lí do → câu kết là lời hứa."}]}},

 secs:[

 sample:{title:"Mỗi ngày nên đọc sách",parts:[
  {t:"Đoạn văn",x:"Em hoàn toàn đồng ý với ý kiến cho rằng mỗi ngày học sinh nên dành thời gian đọc sách. Trước hết, đọc sách giúp em mở rộng hiểu biết về thế giới, từ loài vật trong rừng đến những vùng đất xa xôi. Hơn nữa, sách dạy em cách dùng từ và diễn đạt, nhờ vậy bài văn của em ngày càng phong phú. Chẳng hạn, sau khi đọc truyện về loài chim, em đã biết tả tiếng hót “ríu rít, trong như nước suối”. Tuy nhiên, em cũng nhận ra không nên đọc quá khuya vì sẽ hại mắt. Vì vậy, em sẽ đọc sách mỗi tối khoảng hai mươi phút, ở nơi đủ ánh sáng. Đọc sách đúng cách chính là món quà em tự tặng cho mình.",n:"Ý kiến → 2 lí do (trước hết, hơn nữa) → ví dụ (chẳng hạn) → mặt khác (tuy nhiên) → việc làm → khẳng định."}]}},

 sample:{title:"Dế Mèn phiêu lưu kí",parts:[
  {t:"Mở bài",x:"Trong tủ sách của em, cuốn em đọc đi đọc lại nhiều nhất là “Dế Mèn phiêu lưu kí” của nhà văn Tô Hoài. Em xin giới thiệu cuốn sách này với các bạn.",n:"Có tên sách, tác giả, và lời mở."},
  {t:"Nội dung chính",x:"Truyện kể về chú Dế Mèn khỏe mạnh nhưng còn kiêu căng. Vì một lần nghịch dại, chú gây ra chuyện đau lòng cho bạn hàng xóm. Hối hận, chú rời nhà đi phiêu lưu, gặp nhiều bạn bè và vượt qua nhiều nguy hiểm.",n:"Tóm tắt ngắn, nhắc đủ ý chính nhưng không kể hết."},
  {t:"Điều em thích nhất",x:"Điều em thích nhất là Dế Mèn dám nhận lỗi và thay đổi. Qua mỗi chuyến đi, chú trưởng thành, biết trân trọng tình bạn. Lời văn trong truyện vui tươi, tả thiên nhiên và loài vật rất sống động như thể em đang ở ngay trong vườn cỏ.",n:"Nêu lí do thích cụ thể: nhân vật, bài học, lời văn."},

function analyze(text,T){
 const out=[];const add=(lv,msg,q)=>out.push({lv,msg,q});const tx=String(text||"").replace(/\r/g,"");const w=countW(tx);
 if(!w)return out;
 if(w<T.min)add("warn",`Bài mới có ${w} từ. Dạng này nên viết khoảng ${T.min}–${T.max} từ.`);
 else if(w>T.max*1.3)add("tip",`Bài khá dài (${w} từ). Em đọc lại xem có ý nào bị lặp không.`);
 else add("ok",`Độ dài ổn: ${w} từ.`);
 const paras=tx.split(/\n+/).map(s=>s.trim()).filter(Boolean);
 const prose=T.kind!=="form";
 if(T.kind==="essay"){if(paras.length<3)add("warn",`Bài mới có ${paras.length} đoạn. Bài văn cần ít nhất 3 phần (mở bài, thân bài, kết bài). Em xuống dòng khi sang phần mới nhé.`);else add("ok",`Bài chia thành ${paras.length} đoạn.`)}
 if(T.kind==="para"&&paras.length>2)add("tip","Đây là đoạn văn: em nên viết liền thành một đoạn, chỉ xuống dòng khi sang ý hoàn toàn mới.");
 const units=prose?tx.split(/\n+/).flatMap(p=>p.split(/(?<=[.!?…])["”’)]*\s+/)).map(s=>s.trim()).filter(Boolean):paras;
 if(prose){
  const low=units.filter(s=>/^\p{Ll}/u.test(s));
  low.slice(0,3).forEach(s=>add("warn","Câu bắt đầu chưa viết hoa.",s.split(/\s+/).slice(0,8).join(" ")+"…"));
  if(low.length>3)add("warn",`Còn ${low.length-3} câu nữa chưa viết hoa chữ cái đầu.`);
  const noEnd=paras.filter(p=>!/[.!?…"”:)]$/.test(p));
  noEnd.slice(0,2).forEach(p=>add("tip","Đoạn này chưa có dấu chấm cuối.","…"+p.split(/\s+/).slice(-8).join(" ")));
  const longS=units.filter(s=>countW(s)>35);
  longS.slice(0,2).forEach(s=>add("tip",`Câu này dài (${countW(s)} từ). Em thử tách thành hai câu cho dễ đọc.`,s.split(/\s+/).slice(0,12).join(" ")+"…"));
  for(let i=0;i+2<units.length;i++){const a=units.slice(i,i+3).map(s=>(s.match(/^\S+/)||[""])[0].toLowerCase());if(a[0]&&a[0]===a[1]&&a[1]===a[2]){add("tip",`Ba câu liên tiếp đều bắt đầu bằng “${a[0]}”. Em thử đổi cách mở đầu một câu.`);break}}
 }
 const sp=tx.match(/\S{0,10}\s[,;:!?]\S{0,6}/g);if(sp)add("warn","Dấu câu phải đứng sát chữ đứng trước (không có dấu cách trước dấu phẩy, chấm…).",sp[0].trim());
 const nsp=tx.match(/[\p{L}][,;!?][\p{L}]|[\p{Ll}]\.[\p{L}]/gu);if(nsp)add("warn","Sau dấu câu cần có một dấu cách.",nsp[0]);
 const slang=tx.match(/(^|\s)(ko|k|j|dc|đc|vs|ok|hok|bít|iu|wa)(?=\s|[.,!?]|$)/i);if(slang)add("warn","Em nên viết đầy đủ, không viết tắt hoặc dùng tiếng lóng.",slang[0].trim());
 const dbl=tx.match(/(^|[\s,.;])(\p{L}{2,})\s+\2(?=[\s,.;!?]|$)/iu);if(dbl)add("tip",`Từ “${dbl[2]}” bị lặp liền nhau. Nếu không phải từ láy, em xóa bớt một từ.`);
 if(prose){
  const sim=(tx.match(/(?<![\p{L}])(như thể|tựa như|giống như|hệt như|y như|như|tựa)(?![\p{L}])\s+(?!vậy|thế|sau|mọi|thường|cũ|nhau|một cách|là|trên|đã)/giu)||[]).length;
  if(sim)add("ok",`Em đã dùng ${sim} hình ảnh so sánh.`);else add("tip","Em chưa có hình ảnh so sánh nào. Thử thêm một câu có “như”, “tựa như”, “hệt như”…");
  const bank=T.vocab.flatMap(g=>g.w.map(x=>x.toLowerCase()));const lt=tx.toLowerCase();const used=bank.filter(x=>lt.includes(x));
  if(used.length)add("ok",`Em đã dùng ${used.length} từ trong Kho từ: ${used.slice(0,5).join(", ")}${used.length>5?"…":""}.`);else add("tip","Em chưa dùng từ nào trong Kho từ. Thử chọn 2–3 từ phù hợp nhé.");
 }
 if(T.id==="keChuyen"&&!/[“"”]|^\s*[-–—]/m.test(tx))add("warn","Truyện chưa có lời thoại. Thêm lời nói của nhân vật (trong dấu ngoặc kép hoặc sau dấu gạch đầu dòng) để truyện sinh động hơn.");
 if(T.id==="yKien"){const first=units[0]||"";if(!/đồng ý|đồng tình|tán thành|cho rằng|theo em|không đồng/i.test(first))add("warn","Câu đầu chưa nêu rõ em tán thành hay không tán thành. Em viết thẳng ý kiến của mình ngay câu đầu.");
  const cn=new Set((tx.toLowerCase().match(/vì vậy|bởi vì|hơn nữa|trước hết|tuy nhiên|chẳng hạn|ví dụ|tóm lại|ngược lại|vì /g)||[]));if(cn.size<2)add("tip","Em dùng thêm từ nối như “trước hết”, “hơn nữa”, “chẳng hạn”, “tuy nhiên” để lí lẽ rõ ràng hơn.");else add("ok","Em đã dùng từ nối để lập luận.")}
 if(T.req){const miss=T.req.filter(r=>!new RegExp(r.k,"i").test(tx));miss.forEach(r=>add("warn",r.m));if(!miss.length)add("ok","Đủ các phần bắt buộc của thể thức.")}
 const ord={warn:0,tip:1,ok:2};return out.sort((a,b)=>ord[a.lv]-ord[b.lv]);
}

async function gemini(prompt,json){
 const key=(S.settings.key||"").trim();const models=[...new Set([S.settings.model||"gemini-2.5-flash","gemini-flash-latest","gemini-2.0-flash"])];let last;
 for(const m of models){let res;
  try{res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:Object.assign({temperature:.4},json?{responseMimeType:"application/json"}:{})})})}
  catch(e){const er=new Error("Không kết nối được tới AI. Kiểm tra mạng, hoặc dùng cách sao chép sang Gemini.");er.offline=true;throw er}
  if(res.status===404){last=new Error("Không tìm thấy mô hình AI.");continue}

   if(res.status===429)throw new Error("Hết lượt AI miễn phí lúc này. Chờ 1 phút rồi thử lại.");
   if([400,401,403].includes(res.status))throw new Error("Mã AI chưa dùng được"+(msg?" (Google báo: "+msg+")":"")+". Kiểm tra lại mã trong Góc cô giáo → Cài đặt.");
   throw new Error("AI báo lỗi "+res.status+". "+msg)}
  const d=await res.json();if(m!==S.settings.model)S.settings.model=m;S.m.ai++;save();
  return(((((d.candidates||[])[0]||{}).content||{}).parts)||[]).map(p=>p.text||"").join("").trim()}
 throw last||new Error("Không gọi được AI.")}

function vWrite(id,step){const e=ess(id);if(!e)return vHome();const T=TY(e.type);step=Math.max(1,Math.min(5,step));e.step=Math.max(e.step||1,step);
 const head=`<div class="wrap"><div class="crumb"><button data-a="home">Trang chủ</button> › <button data-a="type" data-id="${T.id}">${esc(T.name)}</button></div><h2>${T.icon} ${esc(T.name)}${e.topic?`: <span class="muted" style="font-weight:400">${esc(e.topic)}</span>`:""}</h2>
 <div class="steps">${STEPS.map((s,i)=>`<button class="${i+1===step?"on":i+1<(e.step||1)?"done":""}" data-a="step" data-id="${e.id}" data-s="${i+1}"><b>${i+1<(e.step||1)&&i+1!==step?"✓":i+1}</b>${s}</button>`).join("")}</div>`;

 if(step===2)b=`<p class="muted">Trả lời các câu hỏi ngắn, ghi ý chính thôi, chưa cần viết thành câu hoàn chỉnh.</p>${T.secs.map((s,i)=>`<div class="card sec" style="margin-bottom:12px"><h3>${i+1}. ${esc(s.t)}</h3><p class="small">${esc(s.p)}</p><ul class="q">${s.q.map(q=>`<li>${esc(q)}</li>`).join("")}</ul><div style="margin-top:6px">${s.s.map(x=>`<span class="chip" data-a="starter" data-i="${i}" data-w="${esc(x)}">${esc(x)}</span>`).join("")}</div><textarea class="ol-in" data-i="${i}" rows="3" placeholder="Ý chính của phần này…">${esc(e.outline[i]||"")}</textarea><div class="row" style="margin-top:6px"><button class="btn sm" data-a="hint" data-i="${i}">💡 Cô trợ lý gợi ý thêm</button></div><div id="hint${i}"></div></div>`).join("")}
  <div class="row"><button class="btn" data-a="step" data-id="${e.id}" data-s="1">← Đề bài</button><button class="btn gold" data-a="step" data-id="${e.id}" data-s="3">Tiếp: Viết bài →</button></div>`;
 if(step===3){const ol=T.secs.map((s,i)=>e.outline[i]?`<div class="ol"><b>${esc(s.t)}</b>\n${esc(e.outline[i])}</div>`:"").join("")||'<p class="small muted">Em chưa ghi dàn ý.</p>';
  b=`<div class="edwrap"><div><div class="paper"><textarea id="ed" placeholder="Em viết bài ở đây…" spellcheck="false">${esc(e.text)}</textarea><div class="stats"><span id="stW"></span><span id="stS"></span><span id="stP"></span><span class="muted">Nên viết ${T.min}–${T.max} từ</span><div class="bar" style="flex:1;min-width:80px;align-self:center"><i id="stB"></i></div></div></div>
   <div class="row" style="margin-top:12px"><button class="btn" data-a="step" data-id="${e.id}" data-s="2">← Dàn ý</button><button class="btn" data-a="snap" data-id="${e.id}">💾 Lưu bản nháp</button>${T.tpl?`<button class="btn" data-a="tpl" data-id="${e.id}">📋 Chèn khung trình bày</button>`:""}<button class="btn gold" data-a="step" data-id="${e.id}" data-s="4">Soát bài →</button></div></div>
   <aside class="side"><div class="card"><details open><summary>Dàn ý của em</summary>${ol}</details></div><div class="card"><details><summary>${T.kind==="form"?"Mẫu câu":"Kho từ"} (bấm để chèn)</summary>${T.vocab.map(v=>`<p class="small" style="margin:8px 0 2px"><b>${esc(v.g)}</b></p>${v.w.map(w=>`<span class="chip" data-a="word" data-w="${esc(w)}">${esc(w)}</span>`).join("")}`).join("")}</details></div>
   <div class="card"><details><summary>Tự soát khi viết</summary><ul class="ok" style="padding-left:18px">${T.check.map((c,i)=>`<li><label style="font-weight:400;margin:0"><input type="checkbox" data-a="chk" data-i="${i}" ${e.chk&&e.chk[i]?"checked":""}> ${esc(c)}</label></li>`).join("")}</ul></details></div></aside></div>`}
 if(step===4)b=vReview(e,T);
 if(step===5)b=vFinish(e,T);
 return head+b+"</div>"}
function sparkline(vals){if(vals.length<2)return"";const w=300,h=64,p=8,mx=10;const pts=vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1),h-p-(v/mx)*(h-2*p)]);
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Điểm AI qua các lần soát"><polyline fill="none" stroke="#2f7d5b" stroke-width="3" points="${pts.map(q=>q.join(",")).join(" ")}"/>${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4.5" fill="#e8a317"/><text x="${q[0]}" y="${q[1]-8}" font-size="11" text-anchor="middle" fill="#1d2b53">${vals[i]}</text>`).join("")}</svg>`}
function revBlock(e,T){const r=lastRev(e);if(!r)return"";const names=(RUBRIC[T.kind]||RUBRIC.essay).map(x=>x[0]);
 return `<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h3>Cô trợ lý AI nhận xét (lần ${e.rev.length})</h3><div><span class="total">${r.total}</span><span class="muted">/10 (tham khảo)</span></div></div>
 <div class="score">${r.scores.map((s,i)=>`<div>${esc(names[i])}<b>${s}</b>/2</div>`).join("")}</div>
 ${r.khen.map(k=>`<div class="fb ok">👍 ${esc(k)}</div>`).join("")}
 ${r.sua.map((x,i)=>`<div class="fb warn ${r.fix[i]?"done":""}"><q>${esc(x.trich)}</q><b>${esc(x.van_de)}</b><br><span>💡 ${esc(x.goi_y)}</span><div style="margin-top:6px"><label style="font-weight:400;margin:0"><input type="checkbox" data-a="fix" data-i="${i}" ${r.fix[i]?"checked":""}> Em đã sửa chỗ này</label></div></div>`).join("")}
 ${r.buoc?`<div class="fb tip"><b>Việc đầu tiên em nên làm:</b> ${esc(r.buoc)}</div>`:""}${r.nx?`<p style="margin-top:8px"><i>${esc(r.nx)}</i></p>`:""}
 <p class="small muted">Điểm do AI ước lượng chỉ để em tham khảo. Cô giáo mới là người chấm bài.</p>${sparkline(e.rev.map(x=>x.total))}</div>`}
function vReview(e,T){const L=analyze(e.text,T);
 if(!countW(e.text))return `<div class="card">Em chưa viết gì. <button class="btn gold" data-a="step" data-id="${e.id}" data-s="3">Quay lại viết bài</button></div>`;
 return `<div class="card"><h3>Máy soát nhanh (không cần mạng)</h3>${L.map(x=>`<div class="fb ${x.lv}">${x.lv==="warn"?"⚠️":x.lv==="tip"?"💡":"✅"} ${esc(x.msg)}${x.q?`<q>${esc(x.q)}</q>`:""}</div>`).join("")||"<p>Không thấy vấn đề nào.</p>"}</div>
 <div class="card" style="margin-top:14px"><h3>Nhờ cô trợ lý AI đọc bài</h3><p class="small muted">AI sẽ khen, chỉ ra chỗ cần sửa và gợi ý cách sửa. <b>AI không viết thay em.</b> Tên em được ẩn trước khi gửi.</p><div class="row"><button class="btn gold" data-a="review" data-id="${e.id}">🤖 Nhờ AI đọc bài</button><button class="btn" data-a="step" data-id="${e.id}" data-s="3">← Quay lại sửa bài</button><button class="btn primary" data-a="step" data-id="${e.id}" data-s="5">Xong, hoàn thiện →</button></div>${hasKey()?"":'<p class="small muted" style="margin-top:8px">Máy chưa có mã AI nên sẽ dùng cách sao chép sang Gemini (miễn phí).</p>'}</div>${revBlock(e,T)}`}
function vFinish(e,T){const r=lastRev(e);const m=stu(e.sid);

let edT;
function after(v,r){
 const ed=$("#ed");if(ed){const e=ess(r[1]);const T=TY(e.type);const upd=()=>{const w=countW(ed.value);$("#stW").textContent=w+" từ";$("#stS").textContent=(ed.value.split(/[.!?…]+\s|\n/).filter(s=>s.trim()).length)+" câu";$("#stP").textContent=(ed.value.split(/\n+/).filter(s=>s.trim()).length)+" đoạn";$("#stB").style.width=Math.min(100,w/T.min*100)+"%"};upd();
  ed.addEventListener("input",()=>{e.text=ed.value;e.t1=Date.now();upd();save()});ed.focus();ed.setSelectionRange(ed.value.length,ed.value.length)}
 const tp=$("#topic");if(tp)tp.addEventListener("input",()=>{const e=ess(r[1]);e.topic=tp.value;save()});
 document.querySelectorAll(".ol-in").forEach(t=>t.addEventListener("input",()=>{const e=ess(r[1]);e.outline[t.dataset.i]=t.value;save()}));
 const xl=$("#xl");if(xl)xl.onchange=importXL;const rs=$("#rs");if(rs)rs.onchange=restore;
 const pin=$("#pin");if(pin)pin.onkeydown=e=>{if(e.key==="Enter")act("pin",pin)}}
function insertAtEd(w){const ed=$("#ed");if(!ed)return false;const e=ess(route()[1]);const a=ed.selectionStart,b=ed.selectionEnd;const pre=ed.value.slice(0,a),post=ed.value.slice(b);const sep=pre&&!/\s$/.test(pre)?" ":"";ed.value=pre+sep+w+post;const p=(pre+sep+w).length;ed.focus();ed.setSelectionRange(p,p);ed.dispatchEvent(new Event("input"));return true}
function snap(e,msg){if(!countW(e.text))return;const l=e.ver[e.ver.length-1];if(l&&l.text===e.text)return;e.ver.push({t:Date.now(),w:countW(e.text),text:e.text});save(true);if(msg)toast("Đã lưu bản nháp "+e.ver.length)}
function newEssay(type,topic){return{id:uid(),sid:S.me,type,topic:topic||"",outline:{},text:"",ver:[],rev:[],chk:{},status:"draft",step:1,t0:Date.now(),t1:Date.now(),tScore:null,tNote:""}}
async function act(a,el){
 const d=el.dataset||{};const r=route();
 switch(a){
 case"home":go("");break;
 case"type":go("t/"+d.id);break;
 case"tab":go("t/"+d.id+"/"+d.t);break;
 case"rand":{const T=TYPES[Math.floor(Math.random()*TYPES.length)];const t=T.topics[Math.floor(Math.random()*T.topics.length)];modal(`<span class="tag" style="background:${T.color}">${esc(T.name)}</span><h3 style="margin-top:8px">${esc(t)}</h3><div class="row" style="margin-top:12px"><button class="btn gold" id="y">Viết đề này</button><button class="btn" id="n">Đề khác</button></div>`,(m,close)=>{$("#y",m).onclick=()=>{close();act("start",{dataset:{id:T.id,topic:t}})};$("#n",m).onclick=()=>{close();act("rand",el)}});break}
 case"start":{if(!await needMe())break;const e=newEssay(d.id,d.topic);S.essays.push(e);save(true);go("w/"+e.id+"/"+(d.topic?2:1));break}
 case"open":{const e=ess(d.id);go("w/"+d.id+"/"+Math.min(e.step||1,3));break}
 case"step":{const e=ess(d.id);if(+d.s>=4)snap(e);if(+d.s>=2&&!(e.topic||"").trim()&&r[2]==="1"){const t=$("#topic");if(t)e.topic=t.value}go("w/"+d.id+"/"+d.s);break}
 case"pick":{const t=$("#topic");t.value=d.t;t.dispatchEvent(new Event("input"));break}
 case"starter":{const t=document.querySelector(`.ol-in[data-i="${d.i}"]`);t.value+=(t.value&&!/\n$/.test(t.value)?"\n":"")+d.w;t.dispatchEvent(new Event("input"));t.focus();break}
 case"word":if(!insertAtEd(d.w))copy(d.w,"Đã sao chép: "+d.w);break;
 case"chk":{const e=ess(r[1]);e.chk[d.i]=el.checked;save();break}
 case"snap":snap(ess(d.id),true);break;
 case"tpl":{const e=ess(d.id);const T=TY(e.type);if(e.text.trim()&&!confirm("Khung trình bày sẽ được thêm vào cuối bài. Em đồng ý không?"))break;e.text=(e.text.trim()?e.text.trim()+"\n\n":"")+T.tpl;save(true);render(true);break}
 case"hint":{const e=ess(r[1]);const T=TY(e.type);const i=+d.i;const s=T.secs[i];const box=$("#hint"+i);const show=L=>box.innerHTML=`<div class="fb tip">${L.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`;
  const pr=`Bạn là cô giáo tiểu học. Học sinh lớp 5 đang lập dàn ý phần “${s.t}” của bài ${T.name}, đề: ${hideName(e.topic)||"(chưa có đề)"}. Ý em đã ghi: ${hideName(e.outline[i])||"(chưa ghi gì)"}.
Hãy đặt đúng 3 câu hỏi gợi mở ngắn, dễ hiểu để giúp em nghĩ thêm chi tiết RIÊNG của em. KHÔNG đưa đáp án, không viết sẵn ý hộ em. Trả về JSON: {"hoi":["...","...","..."]}`;
  if(!hasKey()){show(s.q);break}
  busy(el,true);const res=await askAI(pr,true);busy(el,false);if(res&&res.hoi)show(res.hoi.slice(0,3).map(String));else show(s.q);break}
 case"review":{const e=ess(d.id);snap(e);busy(el,true);const res=await askAI(reviewPrompt(e),true);busy(el,false);
  if(res&&typeof res==="object"){const rv=normReview(res);rv.t=Date.now();rv.ver=e.ver.length;e.rev.push(rv);e.t1=Date.now();save(true);render(true)}break}
 case"fix":{const e=ess(r[1]);const rv=lastRev(e);rv.fix[d.i]=el.checked;save();render(true);break}
 case"copytxt":copy(ess(d.id).text,"Đã sao chép bài văn.");break;
 case"dl":{const e=ess(d.id);const b=new Blob([e.text],{type:"text/plain;charset=utf-8"});const u=URL.createObjectURL(b);const a2=document.createElement("a");a2.href=u;a2.download=(TY(e.type).name+"-"+(stu(e.sid)||{name:"em"}).name).replace(/\s+/g,"_")+".txt";a2.click();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
 case"print":{const e=ess(d.id);const s=stu(e.sid);$("#printArea").innerHTML=`<h2>${esc(TY(e.type).name)}: ${esc(e.topic)}</h2><div class="meta">${esc(s?s.name:"")} · ${esc(S.settings.cls)}${S.settings.school?" · "+esc(S.settings.school):""} · ${fmtD(Date.now())}</div><div class="txt">${esc(e.text)}</div>`;window.print();break}
 case"send":{const e=ess(d.id);snap(e);e.status="sent";e.t1=Date.now();save(true);toast("Đã nộp bài cho cô.");render(true);break}
 case"del":if(confirm("Xóa bài này?")){S.essays=S.essays.filter(e=>e.id!==d.id);save(true);render(true)}break;
 case"co":go("co"+(d.t?"/"+d.t:""));break;
 case"stu":go("co/s/"+d.id);break;
 case"topen":go("co/e/"+d.id);break;
 case"pin":{const v=$("#pin").value;if(v===S.settings.pin){sessionStorage.setItem("coOK","1");render()}else toast("Chưa đúng mã PIN.");break}
 case"ssave":{["cls","school","teacher","pin"].forEach(k=>S.settings[k]=$("#s_"+k).value.trim());save(true);toast("Đã lưu.");break}
 case"ksave":{S.settings.key=$("#s_key").value.trim();save(true);const m=$("#kmsg");if(!hasKey()){m.textContent="Chưa nhập mã.";break}m.innerHTML='<span class="spin"></span>Đang thử…';try{const t=await gemini("Trả lời đúng một chữ: xong",false);m.textContent="AI hoạt động tốt: “"+t.slice(0,20)+"”."}catch(e){m.textContent=e.message}break}
 case"kdel":S.settings.key="";save(true);render(true);break;
 case"addlist":modal(`<h3>Dán danh sách lớp</h3><p class="small muted">Mỗi dòng một họ tên.</p><textarea id="lst" rows="10"></textarea><div class="row" style="margin-top:12px"><button class="btn gold" id="ok">Thêm</button><button class="btn ghost" id="no">Hủy</button></div>`,(m,close)=>{$("#no",m).onclick=close;$("#ok",m).onclick=()=>{addNames($("#lst",m).value.split(/\n/));close()}});break;
 case"export":exportXL();break;
 case"backup":{const b=new Blob([JSON.stringify(S)],{type:"application/json"});const u=URL.createObjectURL(b);const a2=document.createElement("a");a2.href=u;a2.download="em-yeu-viet-van-sao-luu-"+new Date().toISOString().slice(0,10)+".json";a2.click();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
 case"reset":if(confirm("Xóa toàn bộ học sinh và bài viết trên máy này?")&&confirm("Chắc chắn xóa? Không khôi phục được (trừ khi đã sao lưu).")){const k=S.settings;S=DEF();S.settings=k;save(true);renderWho();go("")}break;
 case"tsave":{const e=ess(d.id);e.tScore=[...document.querySelectorAll(".sc")].map(i=>Math.max(0,Math.min(2,Math.round((+i.value||0)*2)/2)));e.tNote=$("#tnote").value.trim();e.tAt=Date.now();save(true);toast("Đã lưu điểm "+sumT(e)+"/10.");break}
 case"redo":{const e=ess(d.id);e.status="draft";e.step=3;save(true);toast("Bài đã được mở lại để em sửa.");break}
 case"tai":{const e=ess(d.id);const sc=[...document.querySelectorAll(".sc")].map(i=>i.value).join(", ");busy(el,true);const res=await askAI(`Bạn là cô giáo tiểu học. Viết nhận xét 2–3 câu cho bài ${TY(e.type).name} của một học sinh lớp 5, giọng ấm áp: khen một điểm cụ thể, nêu một việc em cần cố gắng. Điểm 5 tiêu chí (mỗi tiêu chí tối đa 2): ${sc}. Không dùng tên học sinh. Bài làm:\n"""\n${hideName(e.text)}\n"""`,false);busy(el,false);if(res)$("#tnote").value=String(res).trim();break}
 }}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName==="INPUT"&&b.type==="checkbox")return;if(b.matches("tr,button,span,a,div,label")){act(b.dataset.a,b)}});
document.addEventListener("change",e=>{const b=e.target;if(b.matches("input[type=checkbox][data-a]"))act(b.dataset.a,b)});
document.querySelectorAll(".nav button,.brand").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go||"")));
/* ---------- Excel ---------- */
function addNames(arr){let n=0;arr.map(s=>String(s||"").trim()).filter(Boolean).forEach(nm=>{if(!S.students.some(s=>s.name.toLowerCase()===nm.toLowerCase())){S.students.push({id:uid(),name:nm});n++}});save(true);renderWho();render(true);toast("Đã thêm "+n+" học sinh.")}
function importXL(ev){const f=ev.target.files[0];if(!f)return;if(!window.XLSX){toast("Chưa tải được công cụ Excel (cần mạng). Cô dùng nút Dán danh sách nhé.");return}const rd=new FileReader();rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:"array"});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});const names=rows.map(r=>r.find(c=>typeof c==="string"&&/\p{L}/u.test(c)&&!/^(stt|họ|tên|họ và tên)$/i.test(c.trim()))).filter(Boolean);addNames(names)}catch(e){toast("Không đọc được file.")}};rd.readAsArrayBuffer(f)}
function exportXL(){const A=[["Họ tên","Dạng bài","Đề bài","Số từ","Số bản nháp","Số lần AI soát","Điểm AI lần đầu","Điểm AI lần cuối","Điểm cô","Nhận xét của cô","Trạng thái","Ngày"]];
 S.essays.slice().sort((a,b)=>((stu(a.sid)||{}).name||"").localeCompare((stu(b.sid)||{}).name||"","vi")).forEach(e=>{const r0=e.rev[0],r1=lastRev(e);A.push([(stu(e.sid)||{}).name||"",TY(e.type).name,e.topic,countW(e.text),e.ver.length,e.rev.length,r0?r0.total:"",r1?r1.total:"",sumT(e)==null?"":sumT(e),e.tNote||"",e.status==="sent"?"Đã nộp":"Đang viết",fmtD(e.t1)])});
 if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(A),"Bài viết");XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Chỉ số","Giá trị"],...stats()]),"Thống kê");XLSX.writeFile(wb,"em-yeu-viet-van.xlsx")}
 else{const csv="\ufeff"+A.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="em-yeu-viet-van.csv";a.click()}}
function restore(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.v!==1||!Array.isArray(d.essays))throw 0;if(!confirm("Khôi phục sẽ thay thế dữ liệu hiện có trên máy. Tiếp tục?"))return;S=Object.assign(DEF(),d);save(true);renderWho();go("");toast("Đã khôi phục.")}catch(e){toast("File sao lưu không đúng.")}};rd.readAsText(f)}
/* ---------- khởi động ---------- */
(function boot(){
 const m=location.hash.match(/#ai=([^&]+)/);if(m){S.settings.key=decodeURIComponent(m[1]);save(true);history.replaceState(null,"",location.pathname);toast("Đã lưu mã AI cho máy này.")}
 renderWho();render();
 if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
window.__app={get S(){return S},analyze,TYPES};
})();
</script>
